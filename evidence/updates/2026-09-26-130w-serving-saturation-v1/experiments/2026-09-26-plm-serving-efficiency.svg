<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720">
<title>PLM capped serving-equivalent efficiency by batch size</title>
<desc>Efficiency is completed request rows per second divided by median GPU board watts. Each row is counted as one returned serving with a 16-ID post-decode cap. The GPU still decoded the full response before capping.</desc>
