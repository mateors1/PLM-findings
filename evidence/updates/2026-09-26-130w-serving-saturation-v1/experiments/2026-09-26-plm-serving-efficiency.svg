<text class="small" x="100" y="610">Method: completed requests/s ÷ median measured GPU board power. One completed request counts as one serving-equivalent.</text>
<text class="small" x="100" y="632">The serving payload is limited to 16 IDs after decode; these measurements do not stop autoregressive decode at ID 16.</text>
<text class="small" x="100" y="654">Batch 640 is from the prior sweep; device isolation was unestablished there. Batch 320/336 are the later targeted measurements.</text>
